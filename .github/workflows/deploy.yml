name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_URL: http://alexandra-prudnikova.ru
          NEXT_PUBLIC_API_URL: http://api.alexandra-prudnikova.ru
        run: npm run build

      - name: Copy files
        run: |
          cp -r public out/standalone/
          cp -r out/static out/standalone/out/

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp -r out/standalone/* dist/
          cp deploy.sh dist/

      - name: Deploy files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "dist/*"
          target: "/home/bdt"
          strip_components: 1
          rm: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          SERVER_DESTINATION_PATH: /home/bdt
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: SERVER_DESTINATION_PATH
          script: |
            cd $SERVER_DESTINATION_PATH
            
            echo "📦 Checking for deploy.sh..."
            if [ -f deploy.sh ]; then
              echo "✅ Found deploy.sh, executing..."
              chmod +x deploy.sh
              ./deploy.sh
            else
              echo "⚠️ deploy.sh not found, starting app directly..."
              pm2 restart bdt || pm2 start server.js --name bdt
              pm2 save
            fi
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 Site: http://alexandra-prudnikova.ru"

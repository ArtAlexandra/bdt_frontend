name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_URL: http://alexandra-prudnikova.ru
          NEXT_PUBLIC_API_URL: http://alexandra-prudnikova.ru/api
          NEXT_PUBLIC_ADMIN_VERIFICATION_KEY: ${{ secrets.NEXT_PUBLIC_ADMIN_VERIFICATION_KEY }}
        run: npm run build

      - name: Prepare standalone
        run: |
          cp -r public out/standalone/
          cp -r out/static out/standalone/out/

          # Готовим папку для отправки на сервер
          rm -rf dist
          mkdir -p dist
          cp -r out/standalone/. dist/
          cp deploy.sh dist/

      - name: Create directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2288
          script: |
            mkdir -p ~/bdt
            echo "Directory created: $HOME/bdt"
            ls -ld ~/bdt

      - name: Deploy files with SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2288
          source: "dist/"
          target: "~/bdt"
          strip_components: 1
          rm: false
          overwrite: true
          debug: true

      - name: Deploy with PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_DESTINATION_PATH: $HOME/bdt
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2288
          envs: SERVER_DESTINATION_PATH
          script_path: dist/deploy.sh
